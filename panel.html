
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>SMM Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    header {
      background: #1e293b;
      padding: 22px;
      text-align: center;
    }
    main {
      padding: 25px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border-radius: 15px;
      padding: 25px;
      margin: 20px auto;
      max-width: 400px;
    }
    button {
      background: #10b981;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h2>SMM PANEL</h2>
    <p>Sosyal Medya Hizmet Platformu</p>
  </header>
  <main>
    <h1>Hoş Geldiniz</h1>
    <div class="card">
      <h2>Hizmetlerimiz</h2>
      <p>Instagram, TikTok, YouTube ve Telegram</p>
      <button>Hizmetleri Keşfet</button>
    </div>
  </main>
<section id="uyelik" style="max-width:420px;margin:30px auto;padding:24px;background:#1e293b;color:white;border-radius:16px;font-family:Arial">
  <h2>Üye Ol / Giriş Yap</h2>
  <input id="email" type="email" placeholder="E-posta adresi" style="width:100%;padding:12px;box-sizing:border-box;margin:8px 0">
  <input id="password" type="password" placeholder="Şifre (en az 6 karakter)" style="width:100%;padding:12px;box-sizing:border-box;margin:8px 0">
  <button onclick="uyeOl()">Üye Ol</button>
  <button onclick="girisYap()">Giriş Yap</button>
  <p id="mesaj" role="status"></p>
</section>

<section id="hesabim" style="display:none;text-align:center;color:white">
  <h2>Müşteri Panelim</h2>
  <p id="kullanici"></p>
  <button onclick="cikisYap()">Çıkış Yap</button>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://imfpobffhzxwijifisnz.supabase.co";
const SUPABASE_KEY = "sb_publishable_dc991kHFEe7kBa96AefKyw_7cUV6leC";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

console.log("Supabase bağlantısı oluşturuldu");

window.addEventListener("error", function(event) {
  alert("JavaScript hatası: " + event.message);
});

window.addEventListener("unhandledrejection", function(event) {
  alert("Bağlantı hatası: " + String(event.reason?.message || event.reason));
});
const mesaj = document.getElementById("mesaj");
const email = document.getElementById("email");
const password = document.getElementById("password");

async function uyeOl() {
  const { error } = await db.auth.signUp({
    email: email.value.trim(),
    password: password.value
  });
  mesaj.textContent = error
    ? error.message
    : "Kayıt isteği alındı. Gerekirse e-postanı doğrula.";
}

async function girisYap() {
  const { error } = await db.auth.signInWithPassword({
    email: email.value.trim(),
    password: password.value
  });
  if (error) mesaj.textContent = error.message;
}

async function cikisYap() {
  await db.auth.signOut();
}

function ekranGuncelle(session) {
  document.getElementById("uyelik").style.display =
    session ? "none" : "block";
  document.getElementById("hesabim").style.display =
    session ? "block" : "none";
  document.getElementById("kullanici").textContent =
    session?.user?.email || "";
}

db.auth.onAuthStateChange((_event, session) => {
  ekranGuncelle(session);
});

db.auth.getSession().then(({ data }) => {
  ekranGuncelle(data.session);
});
</script>
</body>
  
</html>
