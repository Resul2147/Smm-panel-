
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>SMM Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    header {
      background: #1e293b;
      padding: 22px;
      text-align: center;
    }
    main {
      padding: 25px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border-radius: 15px;
      padding: 25px;
      margin: 20px auto;
      max-width: 400px;
    }
    button {
      background: #10b981;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h2>SMM PANEL</h2>
    <p>Sosyal Medya Hizmet Platformu</p>
  </header>
  <main>
    <h1>Hoş Geldiniz</h1>
    <div class="card">
      <h2>Hizmetlerimiz</h2>
      <p>Instagram, TikTok, YouTube ve Telegram</p>
      <button>Hizmetleri Keşfet</button>
    </div>
  </main>
</body>
</html>
